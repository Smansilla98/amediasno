# https://docs.railway.com/guides/config-as-code
# Servicio web con Dockerfile + un servicio Postgres en el mismo proyecto.
# En el dashboard, Start Command debe quedar VACÍO: arranca el CMD del Dockerfile (start.sh).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
